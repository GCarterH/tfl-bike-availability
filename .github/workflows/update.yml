name: Update availability

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Download current profiles
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download latest --pattern profiles.json --clobber || echo '{}' > profiles.json

      - name: Add a sample from TfL
        run: python3 scripts/update.py profiles.json

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload latest profiles.json --clobber

      # GitHub pauses scheduled workflows in repos with no commits for 60 days.
      - name: Keep the schedule alive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep scheduled updates running"
            git push
          fi
